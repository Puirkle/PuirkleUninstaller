[package]
name = "puirkle-uninstaller"
version = "0.4.0"
description = "PuirkleUninstaller - Windows uninstaller with forced removal and leftover detection"
edition = "2021"
license = "MIT"
repository = "https://github.com/Puirkle/PuirkleUninstaller"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
walkdir = "2"
trash = "5"
base64 = "0.22"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_ProcessStatus",
  "Win32_System_Com",
  "Win32_System_Com_Urlmon",
  "Win32_System_RestartManager",
] }
windows = { version = "0.62", features = ["ApplicationModel", "Management_Deployment", "Foundation_Collections"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
