<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PuirkleUninstaller</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.svg" alt="" width="34" height="34" />
        <div class="brand-text"><strong>Puirkle</strong><span>Uninstaller</span></div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="all">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>All</span><span class="count" data-count="all"></span>
        </button>
        <label class="nav-check" title="Hide Windows' own system components and built-in Microsoft Store apps">
          <input type="checkbox" id="hide-components" checked> Hide Windows components
        </label>
        <button class="nav-item" data-view="apps">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Apps</span><span class="count" data-count="apps"></span>
        </button>
        <button class="nav-item" data-view="store">
          <svg viewBox="0 0 24 24"><path d="M4 8h16l-1.2 11.1a2 2 0 0 1-2 1.9H7.2a2 2 0 0 1-2-1.9z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/></svg>
          <span>Windows Apps</span><span class="count" data-count="store"></span>
        </button>
        <button class="nav-item" data-view="found" title="Programs on your drives that aren't registered with Windows: portable apps, copied games, Steam libraries">
          <svg viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13l2.5-7h9L19 13M7 16.5h.01"/></svg>
          <span>Found on Drives</span><span class="count" data-count="found"></span>
        </button>
        <button class="nav-item" data-view="recent">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
          <span>Recently Installed</span><span class="count" data-count="recent"></span>
        </button>
        <button class="nav-item" data-view="large">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Largest</span>
        </button>
        <button class="nav-item" data-view="system">
          <svg viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.2-7.5 9.5-4.3-1.3-7.5-5-7.5-9.5V6z"/></svg>
          <span>System Components</span><span class="count" data-count="system"></span>
        </button>
        <div class="nav-label">Tools</div>
        <button class="nav-item" data-view="storage" title="See which folders and files take up space on each drive">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
          <span>Storage</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <label class="allusers" id="allusers-row" title="Also list programs installed under other Windows accounts on this PC (needs administrator)">
          <input type="checkbox" id="allusers"> Show all users' programs
        </label>
        <div class="update" id="update" hidden></div>
        <div class="admin" id="admin"></div>
        <button class="link-btn" id="btn-backups" title="Undo earlier cleanups: restore registry entries, scheduled tasks and recycled files">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/><path d="M12 8v4l3 2"/></svg>
          Backups &amp; Restore
        </button>
        <div class="version-line"><span id="version"></span><button class="link-btn" id="btn-check-update">Check for updates</button></div>
      </div>
    </aside>

    <main class="main">
      <header class="toolbar">
        <label class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="search" type="search" placeholder="Search programs and publishers" autocomplete="off" spellcheck="false" />
          <kbd>Ctrl F</kbd>
        </label>
        <select class="filter" id="filter-drive" title="Show programs on one drive"></select>
        <select class="filter" id="filter-user" title="Show programs for one Windows account"></select>
        <button class="btn ghost" id="btn-refresh" title="Refresh (F5)">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          Refresh
        </button>
      </header>

      <div class="list" id="list">
        <div class="list-head" id="list-head">
          <button data-sort="name" class="col-name">Name</button>
          <button data-sort="publisher" class="col-pub">Publisher</button>
          <button data-sort="size" class="col-size">Size</button>
          <button data-sort="date" class="col-date">Installed</button>
          <button data-sort="version" class="col-ver">Version</button>
        </div>
        <div class="rows" id="rows" tabindex="0"></div>
      </div>

      <footer class="statusbar" id="statusbar">Loading…</footer>

      <section class="storage" id="storage" hidden>
        <div class="st-drives" id="st-drives"></div>
        <div class="st-searchbar">
          <label class="search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
            <input id="st-q" type="search" placeholder="Search every file and folder on your drives — e.g. *.mp4 or setup 2026" autocomplete="off" spellcheck="false" />
          </label>
          <div class="seg" id="st-kind">
            <button data-kind="all" class="on">All</button><button data-kind="files">Files</button><button data-kind="folders">Folders</button>
          </div>
        </div>
        <div class="st-head" id="st-head"></div>
        <div class="st-list" id="st-list"></div>
      </section>
    </main>

    <section class="details" id="details"></section>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
